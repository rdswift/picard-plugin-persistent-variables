[long_description_i18n]
de = """
Dieses Plugin bietet die Möglichkeit, Skriptvariablen zu speichern und abzurufen, die über Titel und Alben hinweg bestehen bleiben.
So können beispielsweise das früheste Aufnahmedatum aller Titel eines Albums ermittelt und gespeichert werden.

Es gibt zwei Arten von persistenten Variablen: Albumvariablen und Sitzungsvariablen. Albumvariablen bleiben über alle Titel eines Albums
hinweg bestehen. Die Informationen zu jedem Album werden separat gespeichert und bei einer Aktualisierung des Albums zurückgesetzt. Die
Informationen werden gelöscht, wenn ein Album entfernt wird. Sitzungsvariablen bleiben über alle Alben und Titel hinweg bestehen und werden
gelöscht, wenn Picard beendet oder neu gestartet wird.

Dieses Plugin fügt acht neue Skriptfunktionen hinzu, die die Verwaltung persistenter Skriptvariablen ermöglichen.
"""

fr = "Ce plugin permet de stocker et de récupérer des variables de script qui persistent d'une piste à l'autre et d'un album à l'autre. Cela permet, par exemple, de rechercher et d'enregistrer la date d'enregistrement la plus ancienne de toutes les pistes d'un album.\n\nDeux types de variables persistantes sont gérés : les variables d'album et les variables de session. Les variables d'album persistent sur toutes les pistes d'un album. Les informations de chaque album sont stockées séparément et sont réinitialisées lorsque l'album est actualisé. Les informations sont effacées lorsqu'un album est supprimé. Les variables de session persistent sur tous les albums et toutes les pistes, et sont effacées lorsque Picard est arrêté ou redémarré.\n\nCe plugin ajoute huit nouvelles fonctions de script pour permettre la gestion des variables de script persistantes."
zh_CN = "此插件提供存储和检索脚本变量的能力，这些变量可以在音轨和专辑之间持久化。这允许类似查找并存储专辑上所有音轨的最早录音日期这样的操作。\n\n维护有两种类型的持久变量 - 专辑变量和会话变量。专辑变量在专辑上的所有音轨之间持久化。每个专辑的信息是分开存储的，当专辑刷新时会重置。当专辑被移除时信息会被清除。会话变量在所有专辑和音轨之间持久化，并在 Picard 关闭或重新启动时被清除。\n\n此插件添加了八个新的脚本函数来管理持久化的脚本变量。"
