"action.title" = "View persistent variables"
"help.clear_a.documentation" = "Clears all album variables for the current album."
"help.clear_s.documentation" = "Clears all session variables."
"help.get_a.documentation" = "Gets the value of the album variable `name`."
"help.get_a.signature" = "$get_a(name)"
"help.get_s.documentation" = "Gets the value of the session variable `name`."
"help.get_s.signature" = "$get_s(name)"
"help.set_a.documentation" = "Sets the album variable `name` to `value`."
"help.set_a.signature" = "$set_a(name,value)"
"help.set_s.documentation" = "Sets the session variable `name` to `value`."
"help.set_s.signature" = "$set_s(name,value)"
"help.unset_a.documentation" = "Clears the album variable `name`."
"help.unset_a.signature" = "$unset_a(name)"
"help.unset_s.documentation" = "Clears the session variable `name`."
"help.unset_s.signature" = "$unset_s(name)"
"manifest.description" = "This plugin provides the ability to store and retrieve script variables that persist across tracks and albums."
"manifest.long_description" = "This plugin provides the ability to store and retrieve script variables that persist across tracks and albums. This allows things like finding and storing the earliest recording date of all of the tracks on an album.\n\nThere are two types of persistent variables maintained - album variables and session variables. Album variables persist across all tracks on an album. Each album's information is stored separately, and is reset when the album is refreshed. The information is cleared when an album is removed. Session variables persist across all albums and tracks, and are cleared when Picard is shut down or restarted.\n\nThis plugin adds eight new scripting functions to allow management of persistent script variables."
"manifest.name" = "Persistent Variables"
"qt.PersistentVariablesDialog.table.header.value" = "Value"
"qt.PersistentVariablesDialog.table.header.variable" = "Variable"
"qt.PersistentVariablesDialog.window.title" = "Persistent Variables"
"ui.section.album" = "Album Variables"
"ui.section.session" = "Session Variables"

