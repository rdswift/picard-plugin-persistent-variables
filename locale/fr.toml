"manifest.description" = "Ce plugin permet de stocker et de récupérer des variables de script qui sont conservées d'une piste à l'autre et d'un album à l'autre."
"manifest.long_description" = "Ce plugin permet de stocker et de récupérer des variables de script qui persistent d'une piste à l'autre et d'un album à l'autre. Cela permet, par exemple, de rechercher et d'enregistrer la date d'enregistrement la plus ancienne de toutes les pistes d'un album.\n\nDeux types de variables persistantes sont gérés : les variables d'album et les variables de session. Les variables d'album persistent sur toutes les pistes d'un album. Les informations de chaque album sont stockées séparément et sont réinitialisées lorsque l'album est actualisé. Les informations sont effacées lorsqu'un album est supprimé. Les variables de session persistent sur tous les albums et toutes les pistes, et sont effacées lorsque Picard est arrêté ou redémarré.\n\nCe plugin ajoute huit nouvelles fonctions de script pour permettre la gestion des variables de script persistantes."
"manifest.name" = "Variables persistantes"
