"manifest.description" = "此插件提供存储和检索脚本变量的能力，这些变量可以在音轨和专辑之间持久化。"
"manifest.long_description" = "此插件提供存储和检索脚本变量的能力，这些变量可以在音轨和专辑之间持久化。这允许类似查找并存储专辑上所有音轨的最早录音日期这样的操作。\n\n维护有两种类型的持久变量 - 专辑变量和会话变量。专辑变量在专辑上的所有音轨之间持久化。每个专辑的信息是分开存储的，当专辑刷新时会重置。当专辑被移除时信息会被清除。会话变量在所有专辑和音轨之间持久化，并在 Picard 关闭或重新启动时被清除。\n\n此插件添加了八个新的脚本函数来管理持久化的脚本变量。"
"manifest.name" = "持久变量"
